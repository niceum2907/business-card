<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitale Visitenkarte</title>

  <!-- App auf dem Handy speichern -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#24ace4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Visitenkarte">
  <link rel="apple-touch-icon" href="logo2.png">

  <!-- QR-Code-Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f4f5f5, #f3f4f5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px 16px;
    }
    .card {
      position: relative;
      z-index: 1;             /* Karte liegt über dem Logo */
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
      overflow: hidden;
    }
    .card-header {
      background: #24ace4;
      color: #fff;
      text-align: center;
      padding: 28px 20px 20px;
    }
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #fff;
      color: #1e3c72;
      font-size: 30px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }
    .card-header h1 { font-size: 24px; }
    .card-header p  { opacity: .85; margin-top: 4px; }
    .card-body { padding: 20px 24px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      color: #333; text-decoration: none;
    }
    .row:last-child { border-bottom: none; }
    .row span:first-child { width: 24px; text-align: center; }
    .row:hover { color: #2a5298; }
    .qr-box {
      text-align: center;
      padding: 0 24px 24px;
    }
    #qrcode { display: inline-block; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 12px; }
    #qrcode img, #qrcode canvas { display: block; }
    .qr-box small { display: block; color: #777; margin-top: 8px; }
    .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    button {
      border: none; cursor: pointer;
      background: #2a5298; color: #fff;
      padding: 10px 16px; border-radius: 8px; font-size: 14px;
    }
    button:hover { background: #1e3c72; }
    button.secondary { background: #e8eefb; color: #1e3c72; }

    /* Logo transparent und zentriert im Hintergrund */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("logo.png") center / min(80vw, 700px) no-repeat;
      opacity: 1.0;          /* Transparenz: 0 = unsichtbar, 1 = voll sichtbar */
      pointer-events: none;   /* Klicks gehen durch das Logo hindurch */
      z-index: 0;
    }

    /* Knopf: als App speichern */
    #app-leiste {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
    }
    #app-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      background: #24ace4;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    #app-btn:hover { background: #1e8fc0; }
    #ios-hinweis {
      display: none;
      color: #333;
      text-align: center;
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Knopf: als App speichern -->
  <div id="app-leiste">
    <button id="app-btn">📲 Save it on your home screen</button>
    <p id="ios-hinweis">
      Auf dem iPhone: Unten auf <b>Teilen</b> tippen ⬆️ und dann <b>„Zum Home-Bildschirm“</b> wählen.
    </p>
  </div>

  <!-- Visitenkarte -->
  <div class="card">
    <div class="card-header">
      <div class="avatar" id="initialen"></div>
      <h1 id="name"></h1>
      <p id="position"></p>
    </div>

    <div class="card-body" id="kontakt"></div>

    <div class="qr-box">
      <div id="qrcode"></div>
      <small id="qr-hinweis"></small>
      <div class="buttons">
        <button onclick="modusWechseln()" class="secondary" id="modus-btn"></button>
        <button onclick="kontaktTeilen()">Kontakt teilen</button>
        <button onclick="qrHerunterladen()" class="secondary">QR als Bild</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================
    //  HIER DEINE DATEN EINTRAGEN
    // ==========================================================
    const person = {
      vorname:  "xy",
      nachname: "xy",
      position: "xy",
      firma:    "xy",
      telefon:  "xy",
      email:    "xy",
      website:  "xy",
      adresse:  { strasse: "xy", plz: "xy", ort: "xy", land: "xy" }
    };

    // Modus des QR-Codes:
    //  "vcard" = Scannen öffnet direkt die Kontaktkarte im Handy (funktioniert ohne Hosting)
    //  "link"  = Scannen öffnet diese Webseite (Datei muss online sein, z. B. GitHub Pages / Netlify)
    let modus = "vcard";

    // Optional: feste URL, unter der diese Seite online liegt
       const onlineUrl = "https://DEIN-BENUTZERNAME.github.io/visitenkarte/";; // z. B. "https://deinname.netlify.app/visitenkarte.html"
    // ==========================================================

    const vollerName = person.vorname + " " + person.nachname;
    const a = person.adresse;

    // Karte befüllen
    document.getElementById("initialen").textContent = person.vorname[0] + person.nachname[0];
    document.getElementById("name").textContent = vollerName;
    document.getElementById("position").textContent = person.position + " · " + person.firma;
    document.getElementById("kontakt").innerHTML = `
      <a class="row" href="tel:${person.telefon.replace(/\s/g, "")}"><span>📞</span><span>${person.telefon}</span></a>
      <a class="row" href="mailto:${person.email}"><span>✉️</span><span>${person.email}</span></a>
      <a class="row" href="${person.website}" target="_blank"><span>🌐</span><span>${person.website.replace(/^https?:\/\//, "")}</span></a>
      <div class="row"><span>📍</span><span>${a.strasse}, ${a.plz} ${a.ort}</span></div>
    `;

    // vCard-Text erzeugen
    function vcardText() {
      return [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${person.nachname};${person.vorname};;;`,
        `FN:${vollerName}`,
        `ORG:${person.firma}`,
        `TITLE:${person.position}`,
        `TEL;TYPE=CELL:${person.telefon}`,
        `EMAIL:${person.email}`,
        `URL:${person.website}`,
        `ADR;TYPE=WORK:;;${a.strasse};${a.ort};;${a.plz};${a.land}`,
        "END:VCARD"
      ].join("\n");
    }

    // QR-Code erzeugen
    let qr;
    function qrErzeugen() {
      const ziel = modus === "vcard" ? vcardText() : (onlineUrl || window.location.href);
      document.getElementById("qrcode").innerHTML = "";
      qr = new QRCode(document.getElementById("qrcode"), {
        text: ziel,
        width: 200,
        height: 200,
        colorDark: "#1e3c72",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      document.getElementById("qr-hinweis").textContent = modus === "vcard"
        ? "Scannen, um den Kontakt direkt zu speichern"
        : "Scannen, um diese Visitenkarte zu öffnen";
      document.getElementById("modus-btn").textContent = modus === "vcard"
        ? "Modus: Kontakt → Link"
        : "Modus: Link → Kontakt";
    }

    function modusWechseln() {
      modus = modus === "vcard" ? "link" : "vcard";
      qrErzeugen();
    }

    // Kontakt teilen (WhatsApp, Mail, AirDrop usw. über das Teilen-Menü des Geräts)
    async function kontaktTeilen() {
      const dateiname = vollerName.replace(/\s/g, "_") + ".vcf";
      const datei = new File([vcardText()], dateiname, { type: "text/vcard" });
      const text = `${vollerName}\n${person.position} · ${person.firma}\n📞 ${person.telefon}\n✉️ ${person.email}\n🌐 ${person.website}`;

      try {
        // 1. Versuch: Kontakt als .vcf-Datei teilen (vor allem auf dem Handy)
        if (navigator.canShare && navigator.canShare({ files: [datei] })) {
          await navigator.share({ files: [datei], title: vollerName, text: "Meine Visitenkarte" });
          return;
        }
        // 2. Versuch: Kontaktdaten als Text (und Link) teilen
        if (navigator.share) {
          const daten = { title: vollerName, text: text };
          if (onlineUrl) daten.url = onlineUrl;
          await navigator.share(daten);
          return;
        }
      } catch (fehler) {
        if (fehler.name === "AbortError") return; // Teilen wurde abgebrochen
      }

      // Notlösung (z. B. PC-Browser ohne Teilen-Funktion): Text in die Zwischenablage kopieren
      try {
        await navigator.clipboard.writeText(text + (onlineUrl ? "\n" + onlineUrl : ""));
        alert("Teilen wird hier nicht unterstützt – die Kontaktdaten wurden in die Zwischenablage kopiert.");
      } catch {
        alert("Teilen wird von diesem Browser nicht unterstützt.");
      }
    }

    // QR-Code als PNG herunterladen (z. B. zum Drucken)
    function qrHerunterladen() {
      const canvas = document.querySelector("#qrcode canvas");
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "visitenkarte-qr.png";
      link.click();
    }

    qrErzeugen();

    // ===== Als App speichern =====
    let installEvent = null;
    const appBtn = document.getElementById("app-btn");
    const istIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const istSchonApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

    // Knopf ausblenden, wenn die Seite schon als App geöffnet ist
    if (istSchonApp) document.getElementById("app-leiste").style.display = "none";

    // Android/Chrome: Installations-Fenster vormerken
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installEvent = e;
    });

    appBtn.addEventListener("click", async () => {
      if (installEvent) {
        installEvent.prompt();                  // Android: Installieren-Fenster öffnen
        await installEvent.userChoice;
        installEvent = null;
      } else if (istIOS) {
        document.getElementById("ios-hinweis").style.display = "block";  // iPhone: Anleitung zeigen
      } else {
        alert("Öffne im Browser-Menü (⋮) den Punkt „Zum Startbildschirm hinzufügen“ oder „App installieren“.");
      }
    });
  </script>
</body>
</html>
